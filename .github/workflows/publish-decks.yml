# Publish weekly repair decks — the "build event" the owner triggers.
#
# Reads open `deck`-labelled issues from the PRIVATE intake repo, turns each attached .pptx
# into posts (identifiers redacted on the way in), and opens a PR here. All compute runs in
# this public repo because Actions minutes are free and unlimited on public repositories and
# metered on private ones — the intake repo holds photos, not workflows.
#
# The PR branch is deliberately `content/…`, NOT `feat/…`: the spec-first gate in the test job
# fails any `feat/*` PR that touches no specs/ file, which would block this on every run.
name: Publish repair decks

on:
  workflow_dispatch:
    inputs:
      intake_repo:
        description: "Private intake repo (owner/name)"
        required: true
        default: "gadjoy/repairs-intake"
      dry_run:
        description: "Parse and report without opening a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Deck → posts
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --quiet -r migration/requirements.txt

      # Required by the privacy interlock: every extracted photo is OCR-scanned and any
      # customer identifier redacted before it is written into the site.
      - name: Install tesseract
        run: sudo apt-get install -y -q tesseract-ocr

      - name: Publish pending decks
        env:
          INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
          RUN_DATE: ${{ github.event.repository.updated_at }}
          OMP_THREAD_LIMIT: "1"          # tesseract's OpenMP collapses under parallelism
        run: |
          python tools/publish_decks.py \
            --from-intake "${{ inputs.intake_repo }}" --notify \
            ${{ inputs.dry_run && '--dry-run' || '' }} | tee /tmp/publish-report.txt

      # Belt and braces over the interlock: re-scan what was actually written, and fail rather
      # than open a PR if any identifier survived. Then record the new images in the
      # reviewed-images manifest, or the build-phase PII gate would OCR them on every future
      # build and eventually trip its MAX_UNREVIEWED ceiling.
      - name: Verify written images and refresh the manifest
        if: ${{ !inputs.dry_run }}
        env:
          OMP_THREAD_LIMIT: "1"
        run: |
          NEW=$(git status --porcelain static/img/uploads | awk '{print $2}')
          if [ -n "$NEW" ]; then
            python migration/scripts/scan_device_identifiers.py --paths $NEW --out /tmp/pii.json
            python - <<'EOF'
          import json, sys
          f = json.load(open('/tmp/pii.json'))
          if f:
              print('::error::identifiers survived redaction in:', [x['path'] for x in f])
              sys.exit(1)
          EOF
            python migration/scripts/build_reviewed_manifest.py
          fi

      - name: Open pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain content static)" ]; then
            echo "No new posts — nothing to open a PR for."
            exit 0
          fi
          BRANCH="content/decks-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "gadjoy-deck-bot"
          git config user.email "noreply@gadjoy.in"
          git checkout -b "$BRANCH"
          git add content static migration/tests/data
          git commit -m "Publish repair decks

          $(cat /tmp/publish-report.txt)"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Publish repair decks ($(date -u +%Y-%m-%d))" \
            --body "$(cat /tmp/publish-report.txt)

          Generated by \`publish-decks.yml\` from the private intake repo. Every photo was
          OCR-scanned and any customer identifier redacted before writing (spec 009 FR-019).
          All gates run on this PR before it can merge."
          gh pr merge --auto --squash "$BRANCH" || \
            echo "::notice::auto-merge not enabled on this repo; merge manually once green"
