# Security gates (spec 012, FR-009 / FR-010; CON-SEC-002).
#
# These are GATES, not a dashboard. CON-SEC-002 exists because ten of twelve fleet
# projects scanned nothing for months while alerts nobody was required to read
# accumulated. Each job here fails the build.
#
# Two scans, deliberately split by cost:
#
#   secrets-worktree   every PR and push. Seconds. Catches a secret being added.
#   secrets-history    nightly. 6m59s measured on this repo's 2.99 GiB pack (a
#                      .wpress backup plus 15,554 wp-export files). Blocking every
#                      PR on a seven-minute scan is how a gate gets bypassed, so
#                      it runs on a schedule and opens an issue instead.
#
# Scan reports contain the secret VALUES they find. They are never uploaded as
# artifacts and never echoed — only counts and rule IDs reach the log.
name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # 02:30 UTC daily, offset from the canary so seven runners on four vCPUs are
    # not all busy at once.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------- dependencies
  dependencies:
    name: Dependency advisories
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      # 3.13 to match the test job. The advisory count genuinely differs by
      # interpreter — on Python 3.8 the resolver cannot install current Pillow or
      # urllib3 and reports 31 advisories, none of which apply to what CI builds.
      # Auditing an environment nothing ships from measures the wrong thing
      # (CON-VER-004). SECURITY.md records both numbers.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --quiet pip-audit

      - name: Audit the build tree
        run: |
          set +e
          python -m pip_audit -r migration/requirements.txt --progress-spinner off
          rc=$?
          echo "exit=$rc"
          exit $rc

      # Guards against the gate passing because it scanned nothing — a clean
      # result and an empty result look identical in the log (CON-VER-005).
      - name: Prove the audit had something to audit
        run: |
          n="$(grep -cvE '^\s*(#|$)' migration/requirements.txt)"
          echo "requirements lines: $n"
          if [[ "$n" -lt 5 ]]; then
            echo "::error::Only $n requirement(s) found — pip-audit may have passed vacuously."
            exit 1
          fi

  # ----------------------------------------------------------------- secrets
  secrets-worktree:
    name: Secrets (working tree)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install gitleaks
        run: |
          ver=8.21.2
          curl -sSL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --source . (relative), matching how the allowlist path regexes are
      # tested. They are written (^|/)-anchored so either form works, but the
      # invocation is kept identical to the tested one on purpose.
      - name: Scan the working tree
        run: |
          set +e
          gitleaks detect --source . --no-git \
            --config .gitleaks.toml --no-banner --redact \
            --report-path /tmp/gitleaks-worktree.json
          rc=$?
          echo "exit=$rc"
          exit $rc

      - name: Report count only (never the values)
        if: failure()
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("/tmp/gitleaks-worktree.json")
          d = json.loads(p.read_text()) if p.is_file() else []
          print(f"::error::{len(d)} secret(s) detected. Rules: "
                f"{sorted({f['RuleID'] for f in d})}. Files: "
                f"{sorted({f['File'] for f in d})}. Values are withheld from this log; "
                f"run gitleaks locally to see them, and rotate before removing.")
          PY

  secrets-history:
    name: Secrets (full history)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the whole point of this job

      - name: Install gitleaks
        run: |
          ver=8.21.2
          curl -sSL -o /tmp/gl.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          tar -xzf /tmp/gl.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan every commit
        id: scan
        run: |
          set +e
          gitleaks detect --source . --log-opts="--all" \
            --config .gitleaks.toml --no-banner --redact \
            --report-path /tmp/gitleaks-history.json
          rc=$?
          echo "exit=$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: File an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Secret scanning: findings in git history';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security',
            });
            if (existing.data.some(i => i.title === title)) return;   // no duplicate spam
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ['security'],
              body: [
                'The nightly full-history secret scan failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Values are redacted in the log by design. Reproduce locally:',
                '',
                '```',
                'gitleaks detect --source . --log-opts="--all" --config .gitleaks.toml',
                '```',
                '',
                'See SECURITY.md. **Rotate first** — untracking or rewriting history does',
                'not undo disclosure.',
              ].join('\n'),
            });
