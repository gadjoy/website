# Build, test and deploy the Hugo site to GitHub Pages.
#
# Pipeline:  test  ->  build  ->  deploy  ->  smoke
#
# `test` runs on pull requests too, so the quality gate the constitution mandates
# ("pytest green AND hugo builds clean") runs BEFORE merge rather than after deploy.
# Until this existed, CI ran no tests at all: every recent bug — contact page falling
# back to the theme layout, a form posting to a dead endpoint, two 404ing images, a
# wrong repair figure — was found by a human on the live site.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  # Gate pull requests as well; the deploy jobs below opt out of PR events.
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      capture_baselines:
        description: "Capture visual baselines on the runner and upload them for review"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------- quality gate
  test:
    name: Test (quality gate, seed ${{ matrix.hashseed }})
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # Two hash seeds (spec 012, FR-013 / CON-VER-008). Python randomises set and
    # dict iteration order per seed, so a test that depends on the order of a set
    # — or on another test's leftover state — passes under one seed and fails
    # under another. With one fixed seed that defect is invisible until it
    # surfaces as an intermittent failure, which is the state the rule calls RED
    # rather than noise. resumefit's two-seed matrix is the in-house precedent.
    #
    # fail-fast is off so a seed-specific failure is distinguishable from a real
    # one: if only seed 1 goes red, the defect is ordering, not logic.
    strategy:
      fail-fast: false
      matrix:
        hashseed: [0, 1]
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Spec-first, enforced. Constitution v2.0.0 requires a spec for changes that add or
      # reshape a user-facing capability; copy edits, CSS tweaks, dependency bumps and
      # single-file bug fixes are exempt and belong on fix/ or chore/ branches. Branch
      # prefix is the declaration, so this check is mechanical: a feat/* PR must touch
      # specs/. Placed first so it fails in seconds rather than after a Hugo install.
      - name: Require a spec on feature branches
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="$(gh pr view "${{ github.event.pull_request.number }}" \
                    --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')"
          if printf '%s\n' "$files" | grep -q '^specs/'; then
            echo "Spec change present."
          else
            echo "::error::This is a feat/* branch with no changes under specs/. Eleven PRs once shipped without a spec and the practice lapsed silently, so this is now enforced. Add specs/NNN-slug/{spec,plan,tasks}.md — or, if this is a copy edit, CSS tweak, dependency bump or single-file bug fix, retarget it onto a fix/ or chore/ branch (see .specify/memory/constitution.md, Development Workflow)."
            exit 1
          fi

      # .hugo-version is the single source of truth for the toolchain version, so
      # dev and CI cannot drift apart (that drift was the PR #6/#7 bug).
      - name: Resolve pinned Hugo version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_ENV"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --quiet -r migration/requirements.txt

      # OCR for the customer-PII gate. Only actually needed when an image is new or
      # modified (the reviewed-images manifest is keyed on content hash, so steady-state
      # builds do no OCR at all) — but installing it unconditionally means a PR that adds
      # a photo of an About screen is caught rather than skipped.
      - name: Install tesseract (image PII gate)
        run: sudo apt-get install -y -q tesseract-ocr

      # Content invariants, HTML->Markdown golden files, toolchain parity, and the
      # build-output assertions. Deliberately no GOOGLE_PLACES_API_KEY: the reviews
      # partial should take its fallback path here.
      # COVERAGE_MIN is the floor, and it only ever ratchets UP (CON-COV-002). It is set
      # from the Makefile so the gate a contributor runs locally is byte-for-byte the gate
      # CI runs (CON-VER-004) — a floor that lives in two places drifts.
      #
      # CON-VER-001 bites here specifically: `--cov-fail-under` does NOT change pytest's
      # summary line. A failing run still prints "185 passed" and exits 1. Never grep this
      # step's log for "passed" — the `run:` block's exit code is the gate, and the explicit
      # `exit=` echo below is there so a human reading the log after an incident sees it too.
      - name: Run test suite (with coverage gate)
        working-directory: migration
        run: |
          floor="$(grep -oP '^COVERAGE_MIN \?= \K[0-9]+' ../Makefile || true)"
          # Distinguish "could not read the floor" from "coverage is below it"
          # (CON-VER-005). Without this the empty case reaches pytest as
          # `--cov-fail-under=` and exits 4 with a pytest usage error, which reads
          # as a pytest problem rather than a Makefile one. Verified by probe.
          if [[ -z "$floor" ]]; then
            echo "::error::Could not read COVERAGE_MIN from Makefile. The gate did not run — this is NOT a coverage failure. Expected a line matching '^COVERAGE_MIN ?= <int>'."
            exit 1
          fi
          echo "Coverage floor from Makefile: ${floor}%"
          set +e
          python -m pytest -q \
            --cov=../tools --cov=scripts --cov-config=../.coveragerc \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under="$floor"
          rc=$?
          echo "exit=$rc"
          exit $rc

  # ------------------------------------------------------------------ end-to-end
  # Spec 012 phase C. Asserts the site in a real browser: journeys, interactive
  # state, and visual baselines at 1440px and 390px.
  #
  # Chromium runs DIRECTLY on the runner — no container, so no --user 1001:1001
  # concern. That is only possible because the Playwright version is pinned:
  # 1.63.0 refuses to install on the runners' Ubuntu 20.04 ("does not support
  # chromium on ubuntu20.04-x64") while 1.60.0 installs and drives it fine.
  # Both verified on the box. requirements-e2e.txt carries the exact pin.
  #
  # Screenshot baselines are environment-specific. They are captured on the
  # self-hosted runners, so on a GitHub-hosted fallback the comparisons SKIP
  # with a stated reason rather than fail — a red gate caused by running
  # somewhere else is one people learn to ignore (CON-VER-008). The journey
  # tests run everywhere.
  e2e:
    name: End-to-end (browser)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Resolve pinned Hugo version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_ENV"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install e2e dependencies
        run: python -m pip install --quiet -r migration/requirements-e2e.txt

      # Keyed on the pin, so a version bump busts the cache rather than reusing
      # browsers built for a different Playwright.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('migration/requirements-e2e.txt') }}

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Assert the installed Playwright matches the pin
        run: |
          pinned="$(grep -oP '^playwright==\K[0-9.]+' migration/requirements-e2e.txt)"
          actual="$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')"
          echo "pinned=$pinned actual=$actual"
          [[ "$pinned" == "$actual" ]] || {
            echo "::error::Playwright $actual installed but $pinned pinned."; exit 1; }

      - name: Run the end-to-end suite
        run: |
          set +e
          python -m pytest e2e/ -q
          rc=$?
          echo "exit=$rc"
          exit $rc

      # Candidates and diff masks, so a visual failure can be LOOKED at rather
      # than guessed at. Only on failure, and never the baselines themselves.
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ github.run_id }}
          path: e2e/_output/
          retention-days: 14
          if-no-files-found: ignore

  # ------------------------------------------------------- baseline capture
  # Manual only (workflow_dispatch with capture_baselines=true). Produces the
  # visual baselines ON THE RUNNER, which is the only place they are valid, and
  # uploads them for a human to review and commit.
  #
  # This job exists because capturing them locally was wrong: this repo has no
  # self-hosted runners registered and CI_RUNS_ON is unset, so CI runs on
  # GitHub-hosted ubuntu-24.04 while the dev box is 20.04. Baselines captured
  # locally therefore never match and every comparison skips — a dormant gate
  # that reports success. Capture where the check actually runs (CON-VER-004).
  #
  # It uploads rather than commits: a job that commits its own expectation can
  # launder a regression into the baseline.
  capture-baselines:
    name: Capture visual baselines (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.capture_baselines
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Resolve pinned Hugo version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_ENV"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install e2e dependencies
        run: |
          python -m pip install --quiet -r migration/requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Capture
        run: python e2e/capture_baselines.py

      - name: Upload for review
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: e2e/baselines/
          retention-days: 14

  # ---------------------------------------------------------------------- build
  build:
    name: Build
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: [test, e2e]
    # Branch, not just event. `workflow_dispatch` is not a pull_request, so the
    # old event-only guard let a MANUAL RUN FROM ANY BRANCH reach build and
    # deploy — which is not hypothetical: dispatching the baseline-capture job
    # from feat/suite-integrity-and-runners started a deploy of that branch.
    # GitHub's github-pages environment branch policy refused it and the live
    # site was untouched, but that is the platform catching it, not this file.
    # Guard by construction (CON-PROC-006).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Resolve pinned Hugo version
        run: echo "HUGO_VERSION=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_ENV"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # --------------------------------------------------------------------- deploy
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: build
    # Branch, not just event. `workflow_dispatch` is not a pull_request, so the
    # old event-only guard let a MANUAL RUN FROM ANY BRANCH reach build and
    # deploy — which is not hypothetical: dispatching the baseline-capture job
    # from feat/suite-integrity-and-runners started a deploy of that branch.
    # GitHub's github-pages environment branch policy refused it and the live
    # site was untouched, but that is the platform catching it, not this file.
    # Guard by construction (CON-PROC-006).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ---------------------------------------------------------------------- smoke
  # Proves the deploy actually works from the outside: DNS, TLS, the custom domain,
  # and the handful of things that have silently broken in production before.
  smoke:
    name: Smoke-test live site
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: deploy
    # Branch, not just event. `workflow_dispatch` is not a pull_request, so the
    # old event-only guard let a MANUAL RUN FROM ANY BRANCH reach build and
    # deploy — which is not hypothetical: dispatching the baseline-capture job
    # from feat/suite-integrity-and-runners started a deploy of that branch.
    # GitHub's github-pages environment branch policy refused it and the live
    # site was untouched, but that is the platform catching it, not this file.
    # Guard by construction (CON-PROC-006).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Smoke-test gadjoy.in
        run: ./scripts/smoke.sh https://gadjoy.in
