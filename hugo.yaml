baseURL: 'https://gadjoy.in/'
languageCode: 'en-us'
title: 'Gadjoy Repair Service'
theme: 'hugo-universal-theme'

# Preserve raw HTML (e.g. migrated <video> blocks) through Markdown rendering
markup:
  goldmark:
    renderer:
      unsafe: true

# Allow the build to read the Google Places API key from the environment
security:
  funcs:
    getenv:
      - '^HUGO_'
      - '^CI$'
      - '^GOOGLE_PLACES_API_KEY$'

# Honour a visitor's Do Not Track signal without the owner configuring anything. Applies
# whenever an analytics ID is set; harmless while none is.
privacy:
  googleAnalytics:
    respectDoNotTrack: true

# Define the number of posts per page
pagination:
  pagerSize: 10

# Site language. Available translations in the theme's i18n directory.
defaultContentLanguage: "en"

# number of words of summarized post content (default 70)
summaryLength: 70

# not pluralize title pages by default
pluralizelisttitles: false

services:
  # Measurement. Paste a GA4 measurement ID (looks like G-XXXXXXXXXX) to switch it on; leave
  # it empty and the site emits no analytics script at all, which is the current state and is
  # asserted by test_no_analytics_until_an_id_is_configured. Not tracking is the default, not
  # something anyone has to remember to turn off.
  #
  # The ID is PUBLIC by design — every site using one shows it in page source. Committing it
  # is correct; it is not a secret, exactly like params.web3forms_key below.
  googleAnalytics:
    id: ""
  # Enable comments by entering your Disqus shortname
  disqus:
    shortname: ""

# --- Progressive web app (spec 013) ------------------------------------------
# The manifest is GENERATED from this file rather than written as a static
# asset, so its name, description and colours trace to a source (Principle X)
# instead of drifting the first time one of them changes.
mediaTypes:
  application/manifest+json:
    suffixes: ["webmanifest"]

outputFormats:
  WebAppManifest:
    mediaType: application/manifest+json
    baseName: manifest
    isPlainText: true
    notAlternative: true

outputs:
  home: ["HTML", "RSS", "WebAppManifest"]

params:
  viewMorePostLink: "/blog/"
  author: "Gadjoy Repair Service"
  defaultKeywords: ["mobile repair", "laptop repair", "electronics repair", "gadjoy"]
  mainSections: ["blog"]
  defaultDescription: "Professional electronics and mobile device repair services"

  # Social media
  facebook_site: ""
  twitter_site: "gadjoyrepair"
  default_sharing_image: "img/sharing-default.png"

  # Google Maps widget
  enableGoogleMaps: true
  googleMapsApiKey: ""
  latitude: "12.9716"  # Bangalore coordinates
  longitude: "77.5946"
  
  # Address for contact page
  address: |
    <p class="text-uppercase"><strong>Gadjoy Repair Service</strong>
    <br>#300, Adj D'Mart, Varthur Rd
    <br>Siddapura, Karnataka 560066
    <br>Bangalore, India
    <br>
    <strong>Professional Electronics Repair</strong>
    </p>

  # Style options: default (light-blue), blue, green, marsala, pink, red, turquoise, violet
  style: "default"

  # Contact form: WhatsApp works with no setup. For the "Email instead" path, paste a free
  # Web3Forms access key (web3forms.com → enter vivek@gadjoy.in → copy key). Public by design;
  # leave empty to fall back to a mailto: link.
  # Progressive web app (spec 013). Colours are the site's own, taken from
  # static/css/custom.css, not invented for the manifest.
  pwa:
    short_name: "Gadjoy"
    description: "Chip-level phone, laptop and tablet repair in Bangalore. Address, hours and contact available offline."
    theme_color: "#111111"
    background_color: "#ffffff"
    hours: "Mon–Sat, 10:00–20:00"
    whatsapp: "919110624049"

  web3forms_key: "440fd317-c78c-43e7-9aa2-b8a7b50279db"
  
  # Contact details
  email: "vivek@gadjoy.in"
  # Every address the shop publishes, in one place (spec 016, FR-005).
  # kalai@ was hard-coded into layouts/_default/contact.html and traced to
  # nothing. It is MOVED here rather than removed: it may be a live route to a
  # real person, and deleting it inside a de-duplication change could lose an
  # enquiry. If it is not wanted, delete it HERE, deliberately.
  contactEmails:
    - "vivek@gadjoy.in"
    - "kalai@gadjoy.in"
  phone: "+91 9110624049"
  # Declared ONCE (spec 017, FR-002). It was hard-coded in four files, so a
  # number change was four edits and a hope that none were missed.
  whatsappNumber: "919110624049"

  # Google reviews (live via Places API; key comes from GOOGLE_PLACES_API_KEY env, never committed)
  googlePlaceId: "ChIJaR2k26gTrjsRcc8FG20jpfk"
  googleReviewsUrl: "https://maps.google.com/?cid=17988823238113087345"

  # Repair volume. `repairsTotal` is the LIFETIME device count across the whole
  # business (founded Nov 2016, ~150 devices/month). It is deliberately NOT the
  # number of case studies published here — Hugo derives that from content/blog,
  # which only covers 2021 onward, so the two figures differ by design. Keep this
  # in step with the résumé/portfolio, which quote the same 15,000+ total.
  repairsTotal: 15000
  repairsSince: 2016
  # An ESTIMATE, and labelled as one wherever it appears in prose (spec 014,
  # FR-008): ~150 devices/month since 2016, not a counted figure. The site must
  # not present it as if someone tallied it.
  repairsBasis: "around 150 a month since"

  # Turnaround and warranty were literals in four templates. They agreed by
  # luck, not by construction. Stated once here so they cannot drift (FR-006).
  turnaroundHours: 24
  warrantyDays: 90

  # Site info
  about_us: "<p>Bangalore's go-to repair bench for phones, laptops, tablets and desktops. Chip-level fixes, genuine parts, honest quotes — and a 90-day warranty on every job.</p>"
  copyright: "Copyright (c) 2026, Gadjoy Repair Service; all rights reserved."

  # Format dates with Go's time formatting
  date_format: "January 2, 2006"

  dropdown_mouse_over: false
  disabled_logo: false
  logo_text: "Gadjoy Repair Service"
  logo: "img/logo.png"
  logo_small: "img/logo-small.png"
  contact_url: "/contact/"

  # Enable or disable top bar with social icons
  topbar:
    enable: true
    # ONE strapline, and the number is a tel: link at EVERY width (spec 016,
    # FR-001). It used to render as plain unclickable text >=992px, with a
    # separate trio of tel/WhatsApp/email icons <992px, while `menu.topbar`
    # added a second phone and email icon at all widths — so the number
    # appeared twice on desktop and two icon sets stacked on mobile.
    text: |
      <p class="gj-topbar-line">⚡ Free diagnosis · 90-day warranty ·
      <a href="tel:+919110624049"><i class="fas fa-phone"></i> +91 9110624049</a></p>

  # Enable and disable widgets for the right sidebar
  widgets:
    categories: true
    tags: true
    search: true

  carouselCustomers:
    items: 6
    auto_play: false
    slide_speed: 2000
    pagination_speed: 1000

  carouselTestimonials:
    items: 4
    auto_play: false
    slide_speed: 2000
    pagination_speed: 1000

  carouselHomepage:
    enable: true
    auto_play: true
    slide_speed: 2000
    pagination_speed: 1000

  features:
    enable: true
    cols: 3
    
  testimonials:
    enable: true
    title: "What Bangalore Says About Us"
    subtitle: "Real reviews from customers who walked in worried and left happy."

  see_more:
    enable: true
    icon: "fas fa-wrench"
    title: "Got a device that's misbehaving?"
    subtitle: "Free diagnosis, honest quote, fast turnaround. Bring it in or message us — we'll take it from there."
    link_url: "/contact/"
    link_text: "Get a free quote"

  clients:
    enable: false

  recent_posts:
    enable: true
    title: "Real Repairs, Real Results"
    subtitle: "Fresh from the bench — a few devices we recently brought back to life."
    hide_summary: false

  footer:
    recent_posts:
      enable: true

# Reproduce the original WordPress permalink structure exactly
# (wp_options.permalink_structure = /%year%/%monthnum%/%day%/%postname%/).
# Note: NO /blog/ prefix — the old migration's /blog/... URLs are rescued via per-post aliases.
permalinks:
  blog: "/:year/:month/:day/:slug/"

taxonomies:
  category: "categories"
  tag: "tags"
  author: "authors"

# Main menu
menu:
  main:
    - name: "Home"
      identifier: "menu.home"
      url: "/"
      weight: 1

    - name: "We Repair"
      identifier: "menu.werepair"
      url: "/services/we-repair/"
      weight: 2

    - name: "We Build"
      identifier: "menu.webuild"
      url: "/services/we-build/"
      weight: 3

    - name: "Blog"
      identifier: "menu.blog"
      url: "/blog/"
      weight: 4

    - name: "Gallery"
      identifier: "menu.gallery"
      url: "/gallery/"
      weight: 5

    - identifier: "contact"
      name: "Contact"
      url: "/contact/"
      weight: 6

  # Top bar social links menu
  # menu.topbar DELETED (spec 016, FR-001): it rendered a second phone and
  # email icon beside params.topbar's strapline at every width, and the theme
  # emits menu items with target=_blank — which on a tel: link opens a blank
  # tab beside the dialer (FR-006). The strapline is now the single source.

